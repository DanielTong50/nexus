[project]
name = "nexus-backend"
version = "0.1.0"
description = "AI-Native Event Production Platform Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "motor>=3.6.0",
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-openai>=0.1.0",
    "httpx>=0.28.0",
    "redis>=5.2.0",
    "sse-starlette>=2.1.0",
    "python-multipart>=0.0.9",
    "python-docx>=1.1.0",
    "slack-sdk>=3.39.0",
    "mcp>=1.25.0",
    "google-api-python-client>=2.188.0",
    "google-auth>=2.47.0",
    "pyjwt[crypto]>=2.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "config"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
